[project]
name = "kiln_controller"
version = "0.1.0"
description = "Kiln Controller service"
readme = "README.md"
authors = [
    { name = "Lonnie Hutchinson", email = "chinacat@chinacat.org" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "flask-restful>=0.3.10",
    "flask-sqlalchemy>=3.1.1",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
]
