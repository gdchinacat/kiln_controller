<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiln Command Center - Smart Kiln Management</title>

  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
            }
          }
        }
      }
    }
  </script>
  <script>
    // The Tailwind Play CDN only compiles @apply inside inline
    // <style type="text/tailwindcss"> blocks, so load the semantic component
    // stylesheet and inject it as one. The page is hidden until it is in place
    // to avoid a flash of unstyled content.
    (function () {
      const root = document.documentElement;
      root.style.visibility = 'hidden';
      fetch('/static/styles.css')
        .then((response) => response.text())
        .then((css) => {
          const style = document.createElement('style');
          style.type = 'text/tailwindcss';
          style.textContent = css;
          document.head.appendChild(style);
        })
        .catch((err) => console.error('Failed to load styles.css', err))
        .finally(() => requestAnimationFrame(() => { root.style.visibility = ''; }));
    })();
  </script>

  <script src="/static/app.js"></script>
</head>
<body x-data="kilnApp" x-on:show-login.window="maybeShowLogin()" class="app-body">

  <div id="app" class="app-shell">

    <!-- Top Navigation Bar -->
    <header class="app-header">
      <div class="app-brand">
        <div class="app-brand-logo">
          <i data-lucide="flame" class="icon-lg"></i>
        </div>
        <div>
          <h1 class="app-title">Kiln Control Hub</h1>
        </div>
      </div>

      <!-- Center Nav Tabs -->
      <nav class="nav-tabs">
        <button @click="switchTab('dashboard')" :class="{ 'is-active': activeTab === $store.tabs.dashboard }" class="nav-tab">
          <i data-lucide="layout-dashboard" class="icon"></i> Dashboard
        </button>
        <button @click="switchTab('users')" :class="{ 'is-active': activeTab === $store.tabs.users }" class="nav-tab">
          <i data-lucide="users" class="icon"></i> Users
        </button>
        <button @click="switchTab('devices')" :class="{ 'is-active': activeTab === $store.tabs.devices }" class="nav-tab">
          <i data-lucide="cpu" class="icon"></i> Kilns
        </button>
        <button @click="switchTab('schedules')" :class="{ 'is-active': activeTab === $store.tabs.schedules }" class="nav-tab">
          <i data-lucide="calendar" class="icon"></i> Schedules
        </button>
        <button @click="switchTab('firings')" :class="{ 'is-active': activeTab === $store.tabs.firings }" class="nav-tab">
          <i data-lucide="calendar" class="icon"></i> Firings
        </button>
      </nav>

      <!-- Right Side Controls -->
      <div class="header-actions">
        <button x-data x-show="$store.auth.isAuthenticated" @click="loginModal.logout()" title="Logout" class="header-button">
          <i data-lucide="log-out" class="icon"></i>
          <span class="header-button-label">Logout</span>
        </button>
      </div>
    </header>

    <main class="app-main">
    <div id="dashboard-tab" x-init="loadTab($el, 'dashboard')"> </div>
    <div id="users-tab" x-init="loadTab($el, 'users')"> </div>
    <div id="devices-tab" x-init="loadTab($el, 'devices')"> </div>
    <div id="schedules-tab" x-init="loadTab($el, 'schedules')"> </div>
    <div id="firings-tab" x-init="loadTab($el, 'firings')"> </div>
    </main>

  <!-- LOGIN MODAL -->
  <div x-show="show" x-data="loginModal" class="modal-backdrop">
    <div class="modal">
      <form @submit.prevent="login()" class="form-stack">
        <div>
          <label class="form-label">Username *</label>
          <input type="text" x-model="form.username" required maxlength="16" class="form-control">
        </div>
        <div>
          <label class="form-label">Password *</label>
          <input type="password" x-model="form.password" required maxlength="16" class="form-control">
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-primary">Login</button>
        </div>
      </form>
    </div>
  </div>

    <!-- CONFIRM DELETE DIALOG -->
    <div x-data="confirmModal" x-show="show" class="modal-backdrop">
      <div @click.outside="dismiss()" class="modal modal--confirm">
        <div class="confirm-header">
          <div class="confirm-icon">
            <i data-lucide="alert-triangle" class="icon-lg"></i>
          </div>
          <h3 class="modal-title">Confirm Deletion</h3>
        </div>
        <p x-text="message" class="confirm-message"></p>
        <div class="form-actions">
          <button @click="dismiss()" class="btn-text">Cancel</button>
          <button @click="confirmed()" class="btn-danger">Delete</button>
        </div>
      </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div class="toast-stack">
      <template x-for="t in $store.toast.toasts" :key="t.id">
        <div :class="`toast--${t.type}`" class="toast">
          <i :data-lucide="t.type === 'success' ? 'check-circle' : t.type === 'error' ? 'alert-circle' : 'info'" class="icon"></i>
          <span x-text="t.message"></span>
        </div>
      </template>
    </div>
  </div>

</body>
</html>
