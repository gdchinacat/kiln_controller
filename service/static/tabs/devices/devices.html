<section x-data="$store.tabs.devices" x-show="show" class="view">
  <div class="view-header">
    <div>
      <h2 class="view-title">Kilns</h2>
      <p class="view-subtitle">Hardware controllers connected to the server ecosystem</p>
    </div>
    <div class="view-toolbar">
    </div>
  </div>

  <div class="kiln-grid">
    <template x-if="($store.devices.items ?? []).length === 0">
      <div class="panel-placeholder">No devices connected.</div>
    </template>
    <template x-for="d in ($store.devices.items ?? [])" :key="d.id">
      <div @click="select(d)" class="panel kiln-card" :class="{ 'is-selected': selected?.id === d.id}">
        <div>
          <div class="kiln-card-header">
            <div>
              <span class="kiln-state-badge">
                <span class="status-dot"></span> Active <!-- kiln state -->
              </span>
              <h3 x-text="d.name" class="kiln-card-title"></h3>
            </div>
            <div class="card-actions">
              <button @click="modal.open(d)" class="row-action"><i x-icon="edit-2" class="icon"></i></button>
              <button @click="modal.delete(d)" class="row-action-danger"><i x-icon="trash-2" class="icon"></i></button>
            </div>
          </div>
          <p x-text="d.description || 'No device description provided.'" class="kiln-card-description"></p>
        </div>

        <div class="kiln-card-footer">
          <div class="detail-row">
            <span class="detail-label">Operator:</span>
            <span x-text="($store.users.items ?? []).find(u => u.id === d.user_id)?.name || 'User ID #' + d.user_id" class="detail-value"></span>
          </div>
        </div>
      </div>
    </template>
  </div>

  <div x-data="MetricsChart('deviceMetricsChart')" class="panel device-metric">
    <div class="device-metric-header">
      <div>
        <div class="device-metric-tags">
          <span class="device-metric-badge">Kiln Metrics</span>
        </div>
      </div>
	  <div class="device-metric-controls">
	    <button @click="chartPropertiesModal.open()"><i x-icon="settings" class="icon"></i></button>

	    <div x-data="{ open: false }" @click.outside="open = false" class="relative">
		  <button @click="open = !open" type="button" class="device-metric-select flex items-center gap-2">
		    <span x-text="selectedMetrics.length ? `Metrics (${selectedMetrics.length})` : 'Select metrics'"></span>
		    <span class="text-xs text-slate-400">▾</span>
		  </button>

		  <div x-show="open" x-transition
			   class="absolute right-0 mt-1 w-64 max-h-80 overflow-y-auto rounded-lg bg-slate-900 border border-slate-700 shadow-xl z-20 p-1.5">
		    <template x-for="[metric, info] in chartableMetrics()" :key="metric">
			  <label class="flex items-center gap-2.5 px-2.5 py-1.5 rounded hover:bg-slate-800 cursor-pointer text-sm text-slate-200 select-none">
			    <input type="checkbox"
					   :value="metric"
					   x-model="selectedMetrics"
					   class="rounded border-slate-600 bg-slate-800 text-orange-500 focus:ring-0">
			    <span class="w-2.5 h-2.5 rounded-full shrink-0"
					  :style="`background-color: ${seriesColor(metric, info) ?? 'transparent'}`"></span>
			    <span x-text="metricLabel(metric, info)" class="truncate"></span>
			  </label>
		    </template>
		  </div>
	    </div>
	  </div>
    </div>

    <div class="device-metric-chart">
      <canvas id="deviceMetricsChart"></canvas>
    </div>

    <!-- CHART PROPERTIES MODAL -->
    <div x-data="chartPropertiesModal" x-show="show" class="modal-backdrop">
      <div @click.outside="close()" class="modal">
        <div class="modal-header">
          <h3 x-text="'Chart Properties'" class="modal-title"></h3>
          <button @click="close()" class="modal-close"><i data-lucide="x" class="icon-md"></i></button>
        </div>
        <form class="form-stack">
          <div>
            <label class="form-label">Start</label>
            <input type="text" x-model="form.start" class="form-control">
          </div>
          <div>
            <label class="form-label">End</label>
            <input type="text" x-model="form.end" class="form-control">
          </div>
          <div>
            <label class="form-label">Step</label>
            <input type="text" x-model="form.step" class="form-control">
          </div>
          <div>
            <label class="form-label">Auto-Refresh (seconds)</label>
            <input type="number" x-model="form.refresh" class="form-control">
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- DEVICE MODAL -->
  <div x-data="modal" x-show="show" class="modal-backdrop">
    <div @click.outside="close()" class="modal">
      <div class="modal-header">
        <h3 x-text="'Edit Kiln'" class="modal-title"></h3>
        <button @click="close()" class="modal-close"><i data-lucide="x" class="icon-md"></i></button>
      </div>
      <form @submit.prevent="submit()" class="form-stack">
        <div>
          <label class="form-label">Name *</label>
          <input type="text" x-model="form.name" required maxlength="30" class="form-control">
        </div>
        <div>
          <label class="form-label">Operator</label>
          <select x-model.number="form.user_id" required class="form-control">
            <template x-for="u in ($store.users.items ?? [])" :key="u.id">
              <option :value="u.id" x-text="`${u.name} (${u.username})`"></option>
            </template>
          </select>
        </div>
        <div>
          <label class="form-label">Description</label>
          <textarea x-model="form.description" rows="2" class="form-control"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" @click="close()" class="btn-text">Cancel</button>
          <button type="submit" class="btn-primary">Save Kiln</button>
        </div>
      </form>
    </div>
  </div>

</section>
