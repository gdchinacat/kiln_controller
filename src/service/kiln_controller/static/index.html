<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiln Controller</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
    button { cursor: pointer; font-family: inherit; }
    .serif { font-family: 'DM Serif Display', Georgia, serif; }
    @keyframes fadeUp  { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin    { to { transform: rotate(360deg); } }
    input, select, textarea {
      font-family: inherit; font-size: 13px; color: #0f172a;
      background: white; border: 1px solid #e2e8f0; border-radius: 7px;
      padding: 8px 12px; outline: none; transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color: #94a3b8; }
    label { font-size: 11px; font-weight: 600; color: #64748b; letter-spacing: 0.08em; text-transform: uppercase; display: block; margin-bottom: 5px; }
    .field { margin-bottom: 14px; }
    .card { background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 24px; }
    .nav-btn { padding:7px 15px; font-size:13px; font-weight:500; border:none; background:transparent; border-radius:6px; color:#64748b; transition:all 0.15s; }
    .nav-btn:hover { background:#f1f5f9; color:#0f172a; }
    .nav-btn.active { background:#0f172a; color:white; }
    .btn-primary { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; background:#0f172a; color:white; border:none; border-radius:7px; font-size:13px; font-weight:500; transition:opacity 0.15s; }
    .btn-primary:hover:not(:disabled) { opacity:0.82; }
    .btn-primary:disabled { opacity:0.35; cursor:not-allowed; }
    .btn-danger  { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; background:#fff1f2; color:#e11d48; border:1px solid #fecdd3; border-radius:7px; font-size:13px; font-weight:500; transition:all 0.15s; }
    .btn-danger:hover:not(:disabled)  { background:#ffe4e6; }
    .btn-ghost   { display:inline-flex; align-items:center; gap:6px; padding:9px 18px; background:#f8fafc; color:#334155; border:1px solid #e2e8f0; border-radius:7px; font-size:13px; font-weight:500; transition:all 0.15s; }
    .btn-ghost:hover   { background:#f1f5f9; }
    .btn-sm { padding: 5px 12px; font-size: 12px; }
    .row { padding:14px 0; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:12px; }
    .row:last-child { border-bottom: none; }
    .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:11px; font-weight:600; }
    .badge-ramp     { background:#eff6ff; color:#2563eb; }
    .badge-constant { background:#f0fdf4; color:#16a34a; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    thead th { padding:11px 16px; text-align:left; font-size:11px; font-weight:600; letter-spacing:0.08em; color:#94a3b8; text-transform:uppercase; background:#f8fafc; border-bottom:1px solid #e2e8f0; }
    tbody td { padding:13px 16px; border-bottom:1px solid #f1f5f9; }
    tbody tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:#f8fafc; }
    .modal-bg { position:fixed; inset:0; background:rgba(15,23,42,0.4); z-index:50; display:flex; align-items:center; justify-content:center; animation:fadeUp 0.15s ease; }
    .modal { background:white; border-radius:14px; padding:28px; width:480px; max-width:90vw; box-shadow:0 20px 60px rgba(0,0,0,0.15); max-height:90vh; overflow-y:auto; }
    .modal h3 { font-size:18px; margin-bottom:20px; }
    .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.6s linear infinite; }
    .empty { color:#94a3b8; font-size:14px; padding:32px 0; text-align:center; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ── Config ────────────────────────────────────────────────────────────────────
// Change this to your kiln controller's address
const BASE = "http://192.168.12.188:5000";

// ── API helpers ───────────────────────────────────────────────────────────────
const req = async (method, path, body) => {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const res = await fetch(BASE + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `HTTP ${res.status}`);
  }
  return res.json();
};

const api = {
  // Users
  getUsers:          ()         => req("GET",    "/user/"),
  getUser:           (id)       => req("GET",    `/user/${id}/`),
  createUser:        (body)     => req("POST",   "/user/",        body),
  updateUser:        (id, body) => req("PUT",    `/user/${id}/`,  body),
  deleteUser:        (id)       => req("DELETE", `/user/${id}/`),

  // Devices
  getDevices:        ()         => req("GET",    "/device/"),
  getDevice:         (id)       => req("GET",    `/device/${id}/`),
  createDevice:      (body)     => req("POST",   "/device/",       body),
  updateDevice:      (id, body) => req("PUT",    `/device/${id}/`, body),
  deleteDevice:      (id)       => req("DELETE", `/device/${id}/`),

  // Schedules
  getSchedules:      ()         => req("GET",    "/schedule/"),
  getSchedule:       (id)       => req("GET",    `/schedule/${id}/`),
  createSchedule:    (body)     => req("POST",   "/schedule/",        body),
  updateSchedule:    (id, body) => req("PUT",    `/schedule/${id}/`,  body),
  deleteSchedule:    (id)       => req("DELETE", `/schedule/${id}/`),

  // Phases  (nested under schedule)
  getPhases:         (sid)          => req("GET",    `/schedule/${sid}/phase/`),
  createPhase:       (sid, body)    => req("POST",   `/schedule/${sid}/phase/`, body),
  updatePhase:       (sid, id, body)=> req("PUT",    `/schedule/${sid}/phase/${id}/`, body),
  deletePhase:       (sid, id)      => req("DELETE", `/schedule/${sid}/phase/${id}/`),
};

// ── Small helpers ─────────────────────────────────────────────────────────────
const PHASE_TYPES = ["RAMP", "CONSTANT"];

function Toast({ toast }) {
  if (!toast) return null;
  const colors = {
    success: { bg:"#f0fdf4", color:"#16a34a", border:"#bbf7d0" },
    error:   { bg:"#fff1f2", color:"#e11d48", border:"#fecdd3" },
    info:    { bg:"white",   color:"#334155", border:"#e2e8f0" },
  }[toast.type] || {};
  return (
    <div style={{ position:"fixed", top:20, right:20, zIndex:999,
      padding:"12px 18px", borderRadius:9, fontSize:13, fontWeight:500,
      boxShadow:"0 4px 16px rgba(0,0,0,0.09)", animation:"fadeUp 0.2s ease",
      background:colors.bg, color:colors.color, border:`1px solid ${colors.border}` }}>
      {toast.msg}
    </div>
  );
}

function useToast() {
  const [toast, setToast] = useState(null);
  const show = (msg, type="info") => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  };
  return [toast, show];
}

function Modal({ title, onClose, children }) {
  return (
    <div className="modal-bg" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
          <h3 className="serif" style={{ fontSize:20, margin:0 }}>{title}</h3>
          <button onClick={onClose} style={{ background:"none", border:"none", fontSize:18, color:"#94a3b8", lineHeight:1 }}>✕</button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return <div className="field"><label>{label}</label>{children}</div>;
}

// ── Users view ────────────────────────────────────────────────────────────────
function UsersView({ showToast }) {
  const [users, setUsers]     = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal]     = useState(null); // null | {mode:'create'|'edit', user?}
  const [form, setForm]       = useState({ username: "", name:"" });
  const [saving, setSaving]   = useState(false);

  const load = useCallback(async () => {
    try { setUsers(await api.getUsers()); }
    catch (e) { showToast(e.message, "error"); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => { load(); }, [load]);

  const openCreate = () => { setForm({ username:"", name:"" }); setModal({ mode:"create" }); };
  const openEdit   = u  => { setForm({ username: u.username, name: u.name }); setModal({ mode:"edit", user:u }); };

  const save = async () => {
    setSaving(true);
    try {
      if (modal.mode === "create") { await api.createUser(form); showToast("User created", "success"); }
      else { await api.updateUser(modal.user.id, form); showToast("User updated", "success"); }
      setModal(null); load();
    } catch (e) { showToast(e.message, "error"); }
    finally { setSaving(false); }
  };

  const del = async (u) => {
    if (!confirm(`Delete user "${u.username}"?`)) return;
    try { await api.deleteUser(u.id); showToast("User deleted", "success"); load(); }
    catch (e) { showToast(e.message, "error"); }
  };

  return (
    <div style={{ maxWidth:700 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:24 }}>
        <div>
          <h2 className="serif" style={{ fontSize:26, marginBottom:4 }}>Users</h2>
          <p style={{ fontSize:14, color:"#64748b" }}>Manage user accounts.</p>
        </div>
        <button className="btn-primary" onClick={openCreate}>+ New User</button>
      </div>

      <div className="card" style={{ padding:0, overflow:"hidden" }}>
        {loading ? <div className="empty">Loading…</div> : users.length === 0 ? (
          <div className="empty">No users yet. Create one to get started.</div>
        ) : (
          <table>
            <thead><tr><th>Username</th><th>Name</th><th></th></tr></thead>
            <tbody>
              {users.map(u => (
                <tr key={u.id}>
                  <td style={{ fontWeight:500 }}>{u.username}</td>
                  <td style={{ fontWeight:500 }}>{u.name}</td>
                  <td style={{ textAlign:"right", width:160 }}>
                    <button className="btn-ghost btn-sm" style={{ marginRight:6 }} onClick={() => openEdit(u)}>Edit</button>
                    <button className="btn-danger btn-sm" onClick={() => del(u)}>Delete</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {modal && (
        <Modal title={modal.mode === "create" ? "New User" : "Edit User"} onClose={() => setModal(null)}>
          <Field label="Username">
            <input style={{ width:"100%" }} value={form.username}
              onChange={e => setForm(f => ({ ...f, username: e.target.value }))}
              placeholder="e.g. alice" />
          </Field>
          <Field label="Name">
            <input style={{ width:"100%" }} value={form.name}
              onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
              placeholder="e.g. Alice" />
          </Field>
          <div style={{ display:"flex", gap:8, justifyContent:"flex-end", marginTop:8 }}>
            <button className="btn-ghost" onClick={() => setModal(null)}>Cancel</button>
            <button className="btn-primary" onClick={save} disabled={saving || !form.name.trim() ||!form.username.trim() }>
              {saving ? <span className="spinner"/> : null}
              {modal.mode === "create" ? "Create" : "Save"}
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

function RequireUsers(users, loading) {
    if(users.length === 0 && !loading) {
        return (
        <div style={{ padding:"12px 16px", borderRadius:8, background:"#fffbeb", border:"1px solid #fde68a", fontSize:13, color:"#92400e", marginBottom:16 }}>
          ⚠ Create a user first before adding schedules.
        </div>
      )
    }
}

// ── Devices view ──────────────────────────────────────────────────────────────
function DevicesView({ showToast }) {
  const [devices, setDevices] = useState([]);
  const [users, setUsers]           = useState([]);
  const [loading, setLoading] = useState(true);
  const [modal, setModal]     = useState(null);
  const [form, setForm]       = useState({ name:"", host: "", port: "", url: "", user_id: "" });
  const [saving, setSaving]   = useState(false);

  const load = useCallback(async () => {
    try { setDevices(await api.getDevices()); }
    catch (e) { showToast(e.message, "error"); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => { load(); }, [load]);

  const openCreate = () => { setForm({ name:"" , host: "", port: "", url: "", user_id: "" }); setModal({ mode:"create" }); }; // todo user name
  const openEdit   = d  => { setForm({ name: d.name, host: d.host, port: String(d.port), url: d.url, user_id: d.user_id }); setModal({ mode:"edit", device:d }); };  // todo user name

  const save = async () => {
    setSaving(true);
    try {
      if (modal.mode === "create") { await api.createDevice(form); showToast("Device created", "success"); }
      else { await api.updateDevice(modal.device.id, form); showToast("Device updated", "success"); }
      setModal(null); load();
    } catch (e) { showToast(e.message, "error"); }
    finally { setSaving(false); }
  };

  const del = async (d) => {
    if (!confirm(`Delete device "${d.name}"?`)) return;
    try { await api.deleteDevice(d.id); showToast("Device deleted", "success"); load(); }
    catch (e) { showToast(e.message, "error"); }
  };

  return (
    <div style={{ maxWidth:700 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:24 }}>
        <div>
          <h2 className="serif" style={{ fontSize:26, marginBottom:4 }}>Devices</h2>
          <p style={{ fontSize:14, color:"#64748b" }}>Manage connected kiln devices.</p>
        </div>
        <button className="btn-primary" onClick={openCreate}> + New Device</button>
      </div>

      {RequireUsers(users, loading)}

      <div className="card" style={{ padding:0, overflow:"hidden" }}>
        {loading ? <div className="empty">Loading…</div> : devices.length === 0 ? (
          <div className="empty">No devices registered yet.</div>
        ) : (
          <table>
            <thead><tr>
                       <th>Name</th>
                       <th>URL</th>
                       <th>Operator</th>
                       <th></th>
            </tr></thead>
            <tbody>
              {devices.map(d => (
                <tr key={d.id}>
                  <td style={{ fontWeight:500 }}>{d.name}</td>
                  <td style={{ fontWeight:500 }}>http://{d.host}:{d.port}{d.url}</td>
                  <td style={{ fontWeight:500 }}>{d.user_id}</td>
                  <td style={{ textAlign:"right", width:160 }}>
                    <button className="btn-ghost btn-sm" style={{ marginRight:6 }} onClick={() => openEdit(d)}>Edit</button>
                    <button className="btn-danger btn-sm" onClick={() => del(d)}>Delete</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {modal && (
        <Modal title={modal.mode === "create" ? "New Device" : "Edit Device"} onClose={() => setModal(null)}>
          <Field label="Name">
            <input style={{ width:"100%" }} value={form.name}
              onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
              placeholder="e.g. Front Kiln" />
          </Field>
          <Field label="Host">
            <input style={{ width:"100%" }} value={form.host}
              onChange={e => setForm(f => ({ ...f, host: e.target.value }))}
              placeholder="e.g. localhost" />
          </Field>
          <Field label="Port">
            <input style={{ width:"100%" }} value={form.port}
              onChange={e => setForm(f => ({ ...f, port: e.target.value }))}
              placeholder="e.g. 5000" />
          </Field>
          <Field label="Url">
            <input style={{ width:"100%" }} value={form.url}
              onChange={e => setForm(f => ({ ...f, url: e.target.value }))}
              placeholder="e.g. /" />
          </Field>
          <Field label="Operator (User)">
            <select style={{ width:"100%" }} value={form.user_id}
              onChange={e => setForm(f => ({ ...f, user_id: e.target.value }))}>
              {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
            </select>
          </Field>
          <div style={{ display:"flex", gap:8, justifyContent:"flex-end", marginTop:8 }}>
            <button className="btn-ghost" onClick={() => setModal(null)}>Cancel</button>
            <button className="btn-primary" onClick={save} disabled={saving || !form.name.trim() || !form.port.trim() || !form.host.trim() || !form.url.trim() || !form.user_id.trim()}>
              {saving ? <span className="spinner"/> : null}
              {modal.mode === "create" ? "Create" : "Save"}
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ── Phase form modal ──────────────────────────────────────────────────────────
function PhaseModal({ scheduleId, phase, nextOrdinal, onClose, onSaved, showToast }) {
  const isEdit = !!phase;
  const [form, setForm] = useState(isEdit ? {
    name:       phase.name       || "",
    ordinal:    phase.ordinal    ?? nextOrdinal,
    phase_type: phase.phase_type || "RAMP",
    temperature: phase.temperature ?? "",
    rate:        phase.rate        ?? "",
    duration:    phase.duration    || "",
  } : {
    name:"", ordinal: nextOrdinal, phase_type:"RAMP", temperature:"", rate:"", duration:"",
  });
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const save = async () => {
    setSaving(true);
    try {
      const body = {
        name:       form.name,
        ordinal:    Number(form.ordinal),
        phase_type: form.phase_type,
        temperature: form.temperature !== "" ? Number(form.temperature) : null,
        rate:        form.rate        !== "" ? Number(form.rate)        : null,
        duration:    form.phase_type === "CONSTANT" && form.duration ? form.duration : null,
      };
      if (isEdit) await api.updatePhase(scheduleId, phase.id, body);
      else        await api.createPhase(scheduleId, body);
      showToast(isEdit ? "Phase updated" : "Phase created", "success");
      onSaved();
    } catch (e) { showToast(e.message, "error"); }
    finally { setSaving(false); }
  };

  return (
    <Modal title={isEdit ? "Edit Phase" : "New Phase"} onClose={onClose}>
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0 16px" }}>
        <div style={{ gridColumn:"1/-1" }}>
          <Field label="Name">
            <input style={{ width:"100%" }} value={form.name}
              onChange={e => set("name", e.target.value)} placeholder="e.g. Slow climb" />
          </Field>
        </div>
        <Field label="Type">
          <select style={{ width:"100%" }} value={form.phase_type} onChange={e => set("phase_type", e.target.value)}>
            <option value="RAMP">RAMP — change temperature</option>
            <option value="CONSTANT">CONSTANT — hold temperature</option>
          </select>
        </Field>
        <Field label="Ordinal">
          <input style={{ width:"100%" }} type="number" value={form.ordinal}
            onChange={e => set("ordinal", e.target.value)} placeholder="10" />
        </Field>
        <Field label="Target Temp (°C)">
          <input style={{ width:"100%" }} type="number" value={form.temperature}
            onChange={e => set("temperature", e.target.value)} placeholder="e.g. 1000" />
        </Field>
        {form.phase_type === "RAMP" && (
          <Field label="Rate (°C/min) — blank = max">
            <input style={{ width:"100%" }} type="number" value={form.rate}
              onChange={e => set("rate", e.target.value)} placeholder="e.g. 100" />
          </Field>
        )}
        {form.phase_type === "CONSTANT" && (
          <Field label="Duration (HH:MM:SS)">
            <input style={{ width:"100%" }} value={form.duration}
              onChange={e => set("duration", e.target.value)} placeholder="e.g. 01:30:00" />
          </Field>
        )}
      </div>
      <div style={{ background:"#f8fafc", borderRadius:8, padding:"10px 14px", fontSize:12, color:"#64748b", marginBottom:16 }}>
        {form.phase_type === "RAMP"
          ? "RAMP: temperature changes at the given rate until the target is reached. Leave rate blank for maximum speed."
          : "CONSTANT: temperature is held at the target for the given duration."}
      </div>
      <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
        <button className="btn-ghost" onClick={onClose}>Cancel</button>
        <button className="btn-primary" onClick={save} disabled={saving || !form.name.trim()}>
          {saving ? <span className="spinner"/> : null}
          {isEdit ? "Save" : "Create"}
        </button>
      </div>
    </Modal>
  );
}

// ── Schedule detail (phases) ──────────────────────────────────────────────────
function ScheduleDetail({ schedule, onBack, showToast }) {
  const [phases, setPhases]     = useState([]);
  const [loading, setLoading]   = useState(true);
  const [phaseModal, setPhaseModal] = useState(null); // null | {mode, phase?}

  const load = useCallback(async () => {
    try { setPhases(await api.getPhases(schedule.id)); }
    catch (e) { showToast(e.message, "error"); }
    finally { setLoading(false); }
  }, [schedule.id]);

  useEffect(() => { load(); }, [load]);

  const nextOrdinal = phases.length > 0
    ? Math.max(...phases.map(p => p.ordinal)) + 10
    : 10;

  const delPhase = async (p) => {
    if (!confirm(`Delete phase "${p.name}"?`)) return;
    try { await api.deletePhase(schedule.id, p.id); showToast("Phase deleted", "success"); load(); }
    catch (e) { showToast(e.message, "error"); }
  };

  const tempLabel = (p) => p.temperature != null ? `${p.temperature}°C` : "ambient";
  const rateLabel = (p) => p.rate != null ? `${p.rate}°C/min` : "max rate";

  return (
    <div style={{ maxWidth:800 }}>
      <button className="btn-ghost btn-sm" style={{ marginBottom:20 }} onClick={onBack}>← Back to Schedules</button>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:24 }}>
        <div>
          <h2 className="serif" style={{ fontSize:26, marginBottom:4 }}>{schedule.name}</h2>
          <p style={{ fontSize:14, color:"#64748b" }}>Schedule ID {schedule.id} · {phases.length} phase{phases.length !== 1 ? "s" : ""}</p>
        </div>
        <button className="btn-primary" onClick={() => setPhaseModal({ mode:"create" })}>+ Add Phase</button>
      </div>

      {/* Visual phase timeline */}
      {phases.length > 0 && (
        <div className="card" style={{ marginBottom:16, padding:"18px 24px" }}>
          <p style={{ fontSize:11, fontWeight:600, letterSpacing:"0.1em", color:"#94a3b8", textTransform:"uppercase", marginBottom:14 }}>
            Firing Profile
          </p>
          <div style={{ display:"flex", alignItems:"flex-end", gap:2, height:80 }}>
            {phases.map((p, i) => {
              const maxTemp = Math.max(...phases.map(ph => ph.temperature || 0)) || 1;
              const h = p.temperature ? Math.max(12, (p.temperature / maxTemp) * 72) : 12;
              const isRamp = p.phase_type === "RAMP";
              return (
                <div key={p.id} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", gap:4 }}>
                  <div style={{ fontSize:10, color:"#94a3b8", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", maxWidth:"100%", textAlign:"center" }}>
                    {p.temperature != null ? `${p.temperature}°` : "amb"}
                  </div>
                  <div style={{
                    width:"100%", height:h, borderRadius:"3px 3px 0 0",
                    background: isRamp
                      ? "linear-gradient(to top, #fbbf24, #ef4444)"
                      : "linear-gradient(to top, #34d399, #059669)",
                    transition:"height 0.3s",
                  }} title={p.name} />
                  <div style={{ fontSize:9, color:"#cbd5e1", whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis", maxWidth:"100%", textAlign:"center" }}>
                    {p.name}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <div className="card" style={{ padding:0, overflow:"hidden" }}>
        {loading ? <div className="empty">Loading…</div> : phases.length === 0 ? (
          <div className="empty">No phases yet. Add one to define the firing profile.</div>
        ) : (
          <table>
            <thead>
              <tr>
                <th style={{ width:50 }}>#</th>
                <th>Name</th>
                <th>Type</th>
                <th>Target</th>
                <th>Rate / Duration</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              {phases.map((p) => (
                <tr key={p.id}>
                  <td style={{ color:"#94a3b8" }}>{p.ordinal}</td>
                  <td style={{ fontWeight:500 }}>{p.name}</td>
                  <td>
                    <span className={`badge badge-${p.phase_type?.toLowerCase()}`}>
                      {p.phase_type}
                    </span>
                  </td>
                  <td>{tempLabel(p)}</td>
                  <td style={{ color:"#64748b" }}>
                    {p.phase_type === "RAMP"
                      ? rateLabel(p)
                      : p.duration || "—"}
                  </td>
                  <td style={{ textAlign:"right", whiteSpace:"nowrap" }}>
                    <button className="btn-ghost btn-sm" style={{ marginRight:6 }}
                      onClick={() => setPhaseModal({ mode:"edit", phase:p })}>Edit</button>
                    <button className="btn-danger btn-sm" onClick={() => delPhase(p)}>Delete</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {phaseModal && (
        <PhaseModal
          scheduleId={schedule.id}
          phase={phaseModal.phase}
          nextOrdinal={nextOrdinal}
          onClose={() => setPhaseModal(null)}
          onSaved={() => { setPhaseModal(null); load(); }}
          showToast={showToast}
        />
      )}
    </div>
  );
}

// ── Schedules view ────────────────────────────────────────────────────────────
function SchedulesView({ showToast }) {
  const [schedules, setSchedules]   = useState([]);
  const [users, setUsers]           = useState([]);
  const [loading, setLoading]       = useState(true);
  const [detail, setDetail]         = useState(null); // selected schedule
  const [modal, setModal]           = useState(null);
  const [form, setForm]             = useState({ name:"", user_id:"" });
  const [saving, setSaving]         = useState(false);

  const load = useCallback(async () => {
    try {
      const [s, u] = await Promise.all([api.getSchedules(), api.getUsers()]);
      setSchedules(s); setUsers(u);
    } catch (e) { showToast(e.message, "error"); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => { load(); }, [load]);

  if (detail) return <ScheduleDetail schedule={detail} onBack={() => setDetail(null)} showToast={showToast} />;

  const openCreate = () => { setForm({ name:"", user_id: users[0]?.id ?? "" }); setModal({ mode:"create" }); };
  const openEdit   = s  => { setForm({ name: s.name, user_id: s.user_id }); setModal({ mode:"edit", schedule:s }); };

  const save = async () => {
    setSaving(true);
    try {
      const body = { name: form.name, user_id: Number(form.user_id) };
      if (modal.mode === "create") { await api.createSchedule(body); showToast("Schedule created", "success"); }
      else { await api.updateSchedule(modal.schedule.id, body); showToast("Schedule updated", "success"); }
      setModal(null); load();
    } catch (e) { showToast(e.message, "error"); }
    finally { setSaving(false); }
  };

  const del = async (s) => {
    if (!confirm(`Delete schedule "${s.name}"?`)) return;
    try { await api.deleteSchedule(s.id); showToast("Schedule deleted", "success"); load(); }
    catch (e) { showToast(e.message, "error"); }
  };

  const userName = (uid) => users.find(u => u.id === uid)?.name || `User ${uid}`;

  return (
    <div style={{ maxWidth:800 }}>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:24 }}>
        <div>
          <h2 className="serif" style={{ fontSize:26, marginBottom:4 }}>Schedules</h2>
          <p style={{ fontSize:14, color:"#64748b" }}>Define firing schedules and their phases.</p>
        </div>
        <button className="btn-primary" onClick={openCreate} disabled={users.length === 0}>
          + New Schedule
        </button>
      </div>

      {RequireUsers(users, loading)}

      <div className="card" style={{ padding:0, overflow:"hidden" }}>
        {loading ? <div className="empty">Loading…</div> : schedules.length === 0 ? (
          <div className="empty">No schedules yet. Create one to define a firing profile.</div>
        ) : (
          <table>
            <thead><tr><th>ID</th><th>Name</th><th>Owner</th><th>Phases</th><th></th></tr></thead>
            <tbody>
              {schedules.map(s => (
                <tr key={s.id}>
                  <td style={{ color:"#94a3b8", width:50 }}>{s.id}</td>
                  <td>
                    <button onClick={() => setDetail(s)}
                      style={{ background:"none", border:"none", fontWeight:600, fontSize:13, color:"#0f172a", cursor:"pointer", textDecoration:"underline", textDecorationColor:"#e2e8f0", padding:0 }}>
                      {s.name}
                    </button>
                  </td>
                  <td style={{ color:"#64748b" }}>{userName(s.user_id)}</td>
                  <td>
                    <span style={{ fontSize:12, color:"#94a3b8" }}>
                      {s.phases ? s.phases.length : "—"} phases
                    </span>
                  </td>
                  <td style={{ textAlign:"right", whiteSpace:"nowrap" }}>
                    <button className="btn-ghost btn-sm" style={{ marginRight:6 }} onClick={() => openEdit(s)}>Edit</button>
                    <button className="btn-danger btn-sm" onClick={() => del(s)}>Delete</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {modal && (
        <Modal title={modal.mode === "create" ? "New Schedule" : "Edit Schedule"} onClose={() => setModal(null)}>
          <Field label="Schedule Name">
            <input style={{ width:"100%" }} value={form.name}
              onChange={e => setForm(f => ({ ...f, name: e.target.value }))}
              placeholder="e.g. Bisque Cone 04" />
          </Field>
          <Field label="Owner (User)">
            <select style={{ width:"100%" }} value={form.user_id}
              onChange={e => setForm(f => ({ ...f, user_id: e.target.value }))}>
              {users.map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
            </select>
          </Field>
          <div style={{ display:"flex", gap:8, justifyContent:"flex-end", marginTop:8 }}>
            <button className="btn-ghost" onClick={() => setModal(null)}>Cancel</button>
            <button className="btn-primary" onClick={save} disabled={saving || !form.name.trim()}>
              {saving ? <span className="spinner"/> : null}
              {modal.mode === "create" ? "Create" : "Save"}
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}


// ── App shell ─────────────────────────────────────────────────────────────────
function App() {
  const [view, setView] = useState("schedules");
  const [toast, showToast] = useToast();

  const VIEWS = [
    { id:"schedules", label:"Schedules" },
    { id:"devices",   label:"Devices"   },
    { id:"users",     label:"Users"     },
  ];

  return (
    <div style={{ minHeight:"100vh", background:"#f8fafc" }}>
      <Toast toast={toast} />

      {/* Header */}
      <header style={{ background:"white", borderBottom:"1px solid #e2e8f0", padding:"0 32px", height:58, display:"flex", alignItems:"center", justifyContent:"space-between", position:"sticky", top:0, zIndex:10 }}>
        <div style={{ display:"flex", alignItems:"center", gap:24 }}>
          <div style={{ display:"flex", alignItems:"center", gap:9 }}>
            <span style={{ fontSize:20 }}>🔥</span>
            <span className="serif" style={{ fontSize:19 }}>Kiln Controller</span>
          </div>
          <nav style={{ display:"flex", gap:3 }}>
            {VIEWS.map(v => (
              <button key={v.id} className={`nav-btn${view===v.id?" active":""}`} onClick={() => setView(v.id)}>
                {v.label}
              </button>
            ))}
          </nav>
        </div>
        <div style={{ fontSize:12, color:"#94a3b8" }}>
          <code style={{ background:"#f1f5f9", padding:"3px 8px", borderRadius:5 }}>{BASE}</code>
        </div>
      </header>

      {/* Main */}
      <main style={{ maxWidth:980, margin:"0 auto", padding:"36px 24px" }}>
        {view === "schedules" && <SchedulesView showToast={showToast} />}
        {view === "devices"   && <DevicesView   showToast={showToast} />}
        {view === "users"     && <UsersView     showToast={showToast} />}
        {view === "api"       && <ApiRefView />}
      </main>

      <footer style={{ borderTop:"1px solid #e2e8f0", padding:"14px 32px", marginTop:48, display:"flex", justifyContent:"space-between", fontSize:12, color:"#94a3b8" }}>
        <span>gdchinacat/kiln_controller · Flask-RESTful + SQLAlchemy</span>
        <span>Change BASE_URL at the top of this file to point at your server</span>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
